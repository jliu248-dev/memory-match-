<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e2a3a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 { margin: 0 0 12px; }
    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }
    button.restart {
      padding: 6px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }
    button.restart:hover { background: #357abd; }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }
    .card {
      aspect-ratio: 1;
      perspective: 600px;
      cursor: pointer;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      font-size: 2.4rem;
      user-select: none;
    }
    .card-back {
      background: linear-gradient(135deg, #4a90e2, #7b5fd6);
    }
    .card-front {
      background: #f7f7f7;
      transform: rotateY(180deg);
    }
    .card.matched .card-front { background: #b8f0c2; }
    .message {
      margin-top: 20px;
      font-size: 1.3rem;
      min-height: 1.6em;
    }
  </style>
</head>
<body>
  <h1>Memory Match</h1>
  <div class="stats">
    <span>Moves: <strong id="moves">0</strong></span>
    <span>Time: <strong id="time">0</strong>s</span>
    <button class="restart" id="restart">Restart</button>
  </div>
  <div class="board" id="board"></div>
  <div class="message" id="message"></div>

  <script>
    const SYMBOLS = ["🍎", "🍌", "🍇", "🍒", "🍉", "🍋", "🥝", "🍑"];

    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matches = 0;
    let seconds = 0;
    let timer = null;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startTimer() {
      if (timer) return;
      timer = setInterval(() => {
        seconds++;
        timeEl.textContent = seconds;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function createBoard() {
      boardEl.innerHTML = "";
      const deck = shuffle([...SYMBOLS, ...SYMBOLS]);
      deck.forEach((symbol) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.symbol = symbol;
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">${symbol}</div>
          </div>`;
        card.addEventListener("click", () => flipCard(card));
        boardEl.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard) return;
      if (card === firstCard) return;
      if (card.classList.contains("matched")) return;

      startTimer();
      card.classList.add("flipped");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }

    function checkMatch() {
      if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        matches++;
        resetTurn();
        if (matches === SYMBOLS.length) {
          stopTimer();
          messageEl.textContent = `🎉 You won in ${moves} moves and ${seconds}s!`;
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
          resetTurn();
        }, 900);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    function restart() {
      stopTimer();
      resetTurn();
      moves = 0;
      matches = 0;
      seconds = 0;
      movesEl.textContent = 0;
      timeEl.textContent = 0;
      messageEl.textContent = "";
      createBoard();
    }

    document.getElementById("restart").addEventListener("click", restart);
    restart();
  </script>
</body>
</html>
